<html lang="en" data-theme="dark"><head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">

<script>try{var t=localStorage.getItem('theme');if(t)t=JSON.parse(t);if(!t)t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
:root{--bg:#0b0e14;--bar:rgba(11,14,20,.88);--surface:#121722;--surface2:#1a2130;--border:#232b3b;--grid:#1a2130;--text:#e8edf5;--muted:#8a94a7;--green:#22c55e;--up:#2bb98a;--dn:#ef5b5b;--amber:#f5b942;--blue:#5b8def;--ma:#5b8def;--vwap:#c084fc;--gbg:rgba(34,197,94,.14);--abg:rgba(245,185,66,.14);--rbg:rgba(239,91,91,.14);--shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.28)}
:root[data-theme=light]{--bg:#f3f5f9;--bar:rgba(243,245,249,.9);--surface:#ffffff;--surface2:#eef1f6;--border:#e1e6ee;--grid:#edf0f5;--text:#0f172a;--muted:#64748b;--green:#16a34a;--up:#15a07a;--dn:#dc3b3b;--amber:#d98a06;--blue:#2f6fe0;--ma:#2f6fe0;--vwap:#9333ea;--gbg:rgba(22,163,74,.1);--abg:rgba(217,138,6,.12);--rbg:rgba(220,59,59,.1);--shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.app{max-width:1180px;margin:0 auto}
.topbar{position:sticky;top:0;z-index:5;background:var(--bar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;border-bottom:1px solid var(--border)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;flex:none}
.title{font-weight:750;font-size:17px;letter-spacing:-.01em;line-height:1.15}
.sub{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.fresh{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--gbg);flex:none}
.fresh.old{background:var(--amber);box-shadow:0 0 0 3px var(--abg)}
.fresh.none{background:var(--muted);box-shadow:none}
.tools{display:flex;gap:8px}
.icon{width:38px;height:38px;border-radius:12px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center}
.icon svg{width:18px;height:18px;stroke:var(--text);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.icon.spin svg{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.views{display:flex;margin-top:10px;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.views button{flex:1;text-align:center;padding:8px 6px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.views button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.stale{display:none;background:var(--abg);color:var(--amber);padding:10px 14px;font-size:13px;font-weight:550;cursor:pointer}
.main{padding:12px 12px 0}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.kpi span{display:block;color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi b{font-size:19px;letter-spacing:-.02em}.kpi small{display:block;color:var(--muted);font-size:11px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;gap:6px;background:var(--bar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:7px 12px calc(env(safe-area-inset-bottom,0px) + 7px)}
.tabbar button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 6px;border-radius:12px;font-size:14px;font-weight:650;color:var(--muted)}
.tabbar button .n{min-width:24px;padding:1px 7px;border-radius:999px;background:var(--surface2);font-size:12px;color:var(--text)}
.tabbar button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.tabbar button.on .n{background:var(--gbg);color:var(--green)}
.list{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:96px}
.card{display:grid;grid-template-columns:42px 1fr 84px auto;gap:12px;align-items:center;padding:13px 14px;border-bottom:1px solid var(--border)}
.card:last-child{border-bottom:0}
.card.sel{background:var(--surface2)}
.av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:750;font-size:13px;flex:none;letter-spacing:.02em}
.av.big{width:36px;height:36px;font-size:12px}
.cn{display:flex;align-items:center;gap:6px}.cn b{font-size:16px;letter-spacing:-.01em}
.nd{width:8px;height:8px;border-radius:50%}.nd.pos{background:var(--green)}.nd.neg{background:var(--dn)}
.dots{display:flex;gap:3px;margin-top:6px}.dots i{width:12px;height:4px;border-radius:2px;background:var(--surface2)}
.dots.e i.on{background:var(--green)}.dots.a i.on{background:var(--amber)}
.spark{width:84px;height:34px;display:block}
.c3{text-align:right;min-width:64px}.c3 b{font-size:16px;letter-spacing:-.01em}.c3 small{display:block;color:var(--muted);font-size:12px}
.up{color:var(--green)}.dn{color:var(--dn)}.am{color:var(--amber)}
.empty{padding:26px 16px;color:var(--muted);text-align:center}
.welcome{padding:26px 20px;text-align:center}
.welcome h2{margin:0 0 6px;font-size:20px;letter-spacing:-.02em}.welcome p{margin:0 0 16px;color:var(--muted);font-size:14px}
.btn{display:inline-block;border-radius:12px;padding:12px 18px;font-weight:700;font-size:15px;border:1px solid var(--border);background:var(--surface2)}
.btn.primary{background:var(--green);color:#fff;border-color:transparent}
.btn.danger{color:var(--dn)}
.foot{padding:4px 18px calc(env(safe-area-inset-bottom,0px) + 110px);color:var(--muted);font-size:11px;line-height:1.5}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(3px)}
.sheetcard{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px;width:100%;max-width:420px;box-shadow:var(--shadow);max-height:90vh;overflow:auto}
.sheetcard h2{margin:0 0 10px;font-size:19px;letter-spacing:-.02em}
.sheetcard label{display:block;font-size:13px;font-weight:650;margin:12px 0 6px}
.sheetcard input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font:inherit}
.sheetcard small,.sheetcard .muted{color:var(--muted);font-size:12px;line-height:1.5;display:block;margin-top:6px}
.sheetcard .row{display:flex;gap:8px;margin-top:16px}.sheetcard .row .btn{flex:1;text-align:center}
.sheetcard hr{border:0;border-top:1px solid var(--border);margin:16px 0}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:14px 0 8px}.bar i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .2s}
.detail-screen{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateX(100%);transition:transform .24s cubic-bezier(.2,.8,.2,1);visibility:hidden}
body.detail .detail-screen{transform:none;visibility:visible}
body.detail{overflow:hidden}
.dbar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;background:var(--bar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px;border-bottom:1px solid var(--border)}
.back{padding:8px 8px;font-size:16px;color:var(--green);font-weight:650;white-space:nowrap}
.dtitle{flex:1;display:flex;align-items:center;gap:9px;min-width:0}.dtitle b{font-size:17px;letter-spacing:-.01em}
.nav{display:flex;gap:6px}.nav button{width:40px;height:38px;border:1px solid var(--border);background:var(--surface);border-radius:11px;font-size:19px}
.dbody{padding:14px 12px calc(env(safe-area-inset-bottom,0px) + 32px);display:grid;gap:12px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:2px 4px}
.price{font-size:32px;font-weight:760;letter-spacing:-.03em;line-height:1.05}
.chg{font-size:14px;font-weight:650;margin-top:4px}
.pill{border-radius:999px;padding:5px 11px;font-size:11px;font-weight:750;letter-spacing:.03em;white-space:nowrap}
.pill.early{background:var(--gbg);color:var(--green)}.pill.about{background:var(--abg);color:var(--amber)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)}
.chartcard{padding:12px 12px 10px}
.rowtools{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.ohlc{color:var(--muted);font-size:12px;line-height:1.5;min-height:36px}.ohlc b{color:var(--text);font-weight:650}
.ranges{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px;flex:none}
.rg{border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:650;color:var(--muted)}
.rg.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.chartbox{position:relative;height:300px;overflow:hidden;border-radius:10px}
canvas{display:block;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.hint{color:var(--muted);font-size:11px;margin:8px 2px 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin:8px 2px 0}.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.sect{padding:14px}
.sect h3{margin:0 0 10px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.metric{background:var(--surface2);border-radius:12px;padding:10px 12px}
.metric span{display:block;color:var(--muted);font-size:11px;font-weight:600}.metric b{font-size:17px;letter-spacing:-.02em}
.metric small{display:block;color:var(--muted);font-size:12px;font-weight:550;margin-top:1px}
.pill.bull{background:var(--gbg);color:var(--green)}.pill.bear{background:var(--rbg);color:var(--dn)}.pill.neu{background:var(--surface2);color:var(--muted)}
.btc{display:block;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
.btc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btc-t{display:block;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.btc b{font-size:20px;letter-spacing:-.02em}.btc .chg{font-size:13px;font-weight:650;margin-left:6px}
.meter{display:flex;gap:4px;margin:10px 0 8px}.meter i{flex:1;height:6px;border-radius:3px;background:var(--surface2)}
.meter i.bull{background:var(--green)}.meter i.bear{background:var(--dn)}.meter i.neu,.meter i.neutral{background:#6b7686}
.btc-s{color:var(--muted);font-size:12.5px;line-height:1.4}
.filters{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.fchip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:650;color:var(--muted)}
.fchip.on{background:var(--gbg);color:var(--green);border-color:transparent}
.rule.bull .ic{background:var(--green);color:#fff}.rule.bear .ic{background:var(--dn);color:#fff}
.who{color:var(--muted);font-weight:550;font-size:12px}
.exit{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-top:1px solid var(--border)}
.exit:first-of-type{border-top:0}.exit b{display:block;font-size:14px}.exit small{color:var(--muted);font-size:12px;line-height:1.4;display:block}.exit .v{text-align:right;white-space:nowrap}
.qt{margin-top:5px;font-size:11px;font-weight:650;color:var(--muted);letter-spacing:.02em}
.dots{align-items:center}
.gate{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:12px;background:var(--gbg);margin-bottom:8px}
.gate.a{background:var(--abg)}
.gate .ic{flex:none;width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:800}
.gate.a .ic{background:var(--amber)}
.gate b{display:block;font-size:14px}.gate small{color:var(--muted);font-size:12px;line-height:1.4;display:block}
.rule{display:flex;gap:10px;align-items:flex-start;padding:9px 2px;border-top:1px solid var(--border)}
.rule:first-of-type{border-top:0}
.rule .ic{flex:none;width:20px;height:20px;border-radius:50%;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:800;margin-top:1px;background:var(--surface2);color:var(--muted)}
.rule.ok .ic{background:var(--green);color:#fff}
.rule b{display:block;font-size:14px}.rule small{color:var(--muted);font-size:12px;line-height:1.4;display:block}
.rule.no b{color:var(--muted);font-weight:550}
.score{float:right;font-size:12px;font-weight:700;color:var(--text);text-transform:none;letter-spacing:0;background:var(--surface2);padding:2px 9px;border-radius:999px}
.nhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.sent{border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.sent.pos{background:var(--gbg);color:var(--green)}.sent.neg{background:var(--rbg);color:var(--dn)}.sent.neu{background:var(--surface2);color:var(--muted)}
.nitem{display:flex;gap:11px;padding:12px 0;border-top:1px solid var(--border)}
.nitem .bar2{flex:none;width:3px;border-radius:2px;background:var(--border)}
.nitem .bar2.pos{background:var(--green)}.nitem .bar2.neg{background:var(--dn)}
.nitem a{font-size:15px;line-height:1.35;font-weight:550}.nitem small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.note{color:var(--muted);font-size:11px;margin-top:8px;line-height:1.5}
@media(min-width:900px){
  .main{display:grid;grid-template-columns:410px 1fr;gap:16px;padding:16px;align-items:start}
  .tabbar{position:static;background:none;border:0;padding:0;margin-bottom:12px;backdrop-filter:none;-webkit-backdrop-filter:none}
  .tabbar button{background:var(--surface);border:1px solid var(--border)}
  .list{margin-bottom:0}.foot{padding-bottom:30px}
  .detail-screen{position:static;transform:none;visibility:visible;overflow:visible;background:none}
  body.detail{overflow:auto}
  .dbar{position:static;background:none;border:0;backdrop-filter:none;padding:0 0 10px}
  .back{display:none}.chartbox{height:430px}.dbody{padding:0}
  .views{max-width:300px}
}
</style></head>
<body>
<div class="app">
  <header class="topbar">
    <div class="toprow">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#0f9d6e"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#lg)"/><g stroke="#fff" stroke-width="1.6" stroke-linecap="round"><path d="M9 17v6M9 14v2"/><path d="M16 14v8M16 11v2"/><path d="M23 9v10M23 7v1"/></g><g fill="#fff"><rect x="7.5" y="16" width="3" height="5" rx=".8"/><rect x="14.5" y="13" width="3" height="6" rx=".8"/><rect x="21.5" y="8" width="3" height="8" rx=".8"/></g></svg>
        <div><div class="title">Breakout Scanner</div><div class="sub"><span class="fresh none" id="fresh"></span><span id="sub"></span></div></div>
      </div>
      <div class="tools">
        <button class="icon" id="btn-scan" onclick="startScan()" aria-label="Scan the market now"></button>
        <button class="icon" id="btn-set" onclick="showSettings()" aria-label="Settings"></button>
        <button class="icon" id="theme" onclick="toggleTheme()" aria-label="Toggle light or dark theme"></button>
      </div>
    </div>
    <div class="views" id="views"></div>
  </header>
  <div class="stale" id="stale" onclick="startScan()"></div>
  <main class="main">
    <div class="col">
      <div id="btccard"></div>
      <div class="summary" id="summary"></div>
      <div class="filters" id="filters"></div>
      <nav class="tabbar" id="tabbar"><button id="t-early" onclick="setTab('early')"></button><button id="t-about" onclick="setTab('about')"></button></nav>
      <section class="list" id="list"></section>
    </div>
    <section class="detail-screen" id="detail">
      <div class="dbar">
        <button class="back" onclick="back()">‹ Back</button>
        <div class="dtitle"><span id="d-av"></span><b id="d-coin"></b></div>
        <div class="nav" id="nav"><button onclick="step(-1)" aria-label="Previous coin">‹</button><button onclick="step(1)" aria-label="Next coin">›</button></div>
      </div>
      <div class="dbody">
        <div class="empty" id="d-empty">Select a coin</div>
        <div id="d-content" style="display:none;gap:12px;grid-template-columns:minmax(0,1fr)">
          <div class="hero"><div><div class="price" id="d-price"></div><div class="chg" id="d-chg"></div></div><span class="pill" id="d-pill"></span></div>
          <div class="panel chartcard">
            <div class="rowtools"><div class="ohlc" id="ohlc"></div><div class="ranges" id="ranges"></div></div>
            <div class="chartbox"><canvas id="cv"></canvas></div>
            <div class="legend" id="legend"></div>
            <div class="hint">Touch and drag across the chart to read each weekly candle.</div>
          </div>
          <div class="panel sect" id="why"></div>
          <div class="panel sect" id="extra"></div>
          <div class="panel sect" id="pro"></div>
          <div class="panel sect" id="risk"></div>
          <div class="panel sect"><h3>Key numbers</h3><div class="metrics" id="stats"></div></div>
          <div class="panel sect" id="news"></div>
        </div>
      </div>
    </section>
  </main>
  <div class="foot" id="foot"></div>
</div>
<div class="sheet" id="sheet"><div class="sheetcard" id="sheetcard"></div></div>
<script>
/* =====================================================================
   SCANNER ENGINE (runs in your browser; no server, no exchange account)
   Coin list: CoinGecko.  Candles + news: CoinDesk Data (needs a key),
   or, optionally, public market data (no key, no account).
   ===================================================================== */
const QS=new URLSearchParams(location.search);
const CFG={ // tweak via the page URL, e.g. ?minrules=3&maxdist=8
  TOP_N:200, MAX_DIST:+(QS.get('maxdist')||6), MIN_RULES:+(QS.get('minrules')||4),
  LOOKBACK:4, MAX_EXT:15, MIN_VOL:QS.has('minvol')?+QS.get('minvol'):5e6, MIN_WEEKS:40,
  NEWS_DAYS:14, NEWS_MAX:8, CONC:3
};
const EXCLUDE=new Set(['btc','usdt','usdc','dai','usde','fdusd','tusd','usds','pyusd','usdd','usdy','usd1','wbtc','weth','steth','wsteth','weeth','cbbtc','bsc-usd','wbeth','usdt0','susde','buidl']);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const store={get(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}},del(k){try{localStorage.removeItem(k);}catch(e){}}};
const S={key:store.get('bs_key')||'',src:store.get('bs_src')||'coindesk',mode:store.get('bs_mode')||'live',scanning:false,cancel:false};
let RESULT=store.get('bs_result_v1');

/* ---------- network ---------- */
const DIAG={msg:''};
function keyError(){const e=new Error('KEY');e.key=true;e.details=DIAG.msg;return e;}
function netError(msg){const e=new Error('NET');e.net=true;e.details=msg;return e;}
async function jget(url,tries){
  tries=tries||3;
  for(let a=0;a<tries;a++){
    try{const r=await fetch(url);
      if(r.status===429){DIAG.msg='CoinGecko rate limit (HTTP 429)';await sleep(4000*(a+1));continue;}
      if(!r.ok)throw new Error('HTTP '+r.status);
      return await r.json();
    }catch(e){DIAG.msg=String((e&&e.message)||e);if(a===tries-1)throw e;await sleep(1200*(a+1));}
  }
  throw new Error('CoinGecko is rate-limiting this device. Wait a minute and try again.');
}
function errMsg(j){const e=j&&j.Err;if(!e)return '';if(typeof e==='string')return e;if(e.message)return String(e.message);return Object.keys(e).length?JSON.stringify(e).slice(0,160):'';}
const listOf=j=>{const d=j&&j.Data;return Array.isArray(d)?d:(d&&Array.isArray(d.LIST)?d.LIST:[]);};
async function cdGet(path,params,tries){
  tries=tries||3;
  const q=new URLSearchParams(params||{});if(S.key)q.set('api_key',S.key);
  const url='https://data-api.coindesk.com'+path+'?'+q.toString();
  for(let a=0;a<tries;a++){
    let r,txt;
    try{r=await fetch(url);txt=await r.text();}
    catch(e){
      DIAG.msg='Could not reach data-api.coindesk.com ('+((e&&e.message)||e)+'). Possible causes: no internet, an ad-blocker or VPN, or the browser blocking the request.';
      if(a===tries-1)throw netError(DIAG.msg);
      await sleep(1200*(a+1));continue;
    }
    let j=null;try{j=JSON.parse(txt);}catch(e){}
    const em=errMsg(j);
    if(r.status===429){DIAG.msg='CoinDesk rate limit (HTTP 429)';await sleep(4000*(a+1));continue;}
    if(r.status===401||r.status===403){DIAG.msg='CoinDesk refused the key (HTTP '+r.status+')'+(em?': '+em:'');throw keyError();}
    if(!r.ok){DIAG.msg='CoinDesk HTTP '+r.status+(em?': '+em:'');return null;}
    if(em){DIAG.msg='CoinDesk says: '+em;if(/api.?key|unauthori/i.test(em))throw keyError();return null;}
    return j;
  }
  const err=new Error('RATE');err.rate=true;throw err;
}
async function topCoins(){
  let j;
  try{j=await jget('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page='+CFG.TOP_N+'&page=1');}
  catch(e){throw new Error('Could not load the top-200 coin list from CoinGecko ('+((e&&e.message)||e)+'). Try again in a minute.');}
  const out=j.filter(c=>!EXCLUDE.has(String(c.symbol).toLowerCase())).map(c=>({sym:String(c.symbol).toUpperCase(),mcap:c.market_cap||0,price:c.current_price}));
  if(!out.length)throw new Error('CoinGecko returned an empty coin list.');
  return out;
}

/* ---------- candles ---------- */
// CoinDesk Data: daily candles -> weekly (Mon-Sun, UTC)
async function coindeskDaily(sym){
  for(const lim of [700,365]){
    const j=await cdGet('/index/cc/v1/historical/days',{market:'cadli',instrument:sym+'-USD',limit:lim,groups:'OHLC,VOLUME'});
    const d=listOf(j);
    if(d.length)return d.map(x=>({time:+x.TIMESTAMP,open:+x.OPEN,high:+x.HIGH,low:+x.LOW,close:+x.CLOSE,volumefrom:+(x.VOLUME||0)})).filter(x=>isFinite(x.time)).sort((a,b)=>a.time-b.time);
    if(!/limit|plan|365|history|range|exceed/i.test(DIAG.msg))return null; // e.g. unsupported coin: do not retry
  }
  return null;
}
function toWeekly(rows,cgPrice){
  rows=rows.filter(r=>r.close>0&&r.high>0&&r.low>0);
  if(rows.length<150)return null;
  const lc=rows[rows.length-1].close;
  if(cgPrice&&!(lc/cgPrice>=0.75&&lc/cgPrice<=1.33))return null; // ticker clash guard
  const m=new Map();
  for(const r of rows){
    const day=Math.floor(r.time/86400),ws=day-((day+3)%7);
    let b=m.get(ws);
    if(!b){b={ts:ws*86400000,open:r.open,high:r.high,low:r.low,close:r.close,volume:0};m.set(ws,b);}
    b.high=Math.max(b.high,r.high);b.low=Math.min(b.low,r.low);b.close=r.close;b.volume+=(r.volumefrom||0);
  }
  return Array.from(m.values()).sort((a,b)=>a.ts-b.ts).slice(1); // first week is usually partial
}
// Optional backup: public market data, weekly candles straight from a public price feed (no account, no key)
async function publicWeekly(sym,cgPrice){
  const url='https://data-api.binance.vision/api/v3/klines?symbol='+encodeURIComponent(sym)+'USDT&interval=1w&limit=110';
  for(let a=0;a<3;a++){
    let r;
    try{r=await fetch(url);}
    catch(e){DIAG.msg='Could not reach the public market-data server ('+((e&&e.message)||e)+')';if(a===2)throw netError(DIAG.msg);await sleep(1200*(a+1));continue;}
    if(r.status===429||r.status===418){DIAG.msg='Public data rate limit (HTTP '+r.status+')';await sleep(5000*(a+1));continue;}
    if(r.status===451||r.status===403){DIAG.msg='Public market data is not available in your region (HTTP '+r.status+')';const e=new Error('REGION');e.region=true;throw e;}
    if(!r.ok)return null; // coin not listed there
    const k=await r.json();
    if(!Array.isArray(k)||k.length<CFG.MIN_WEEKS)return null;
    const w=k.map(x=>({ts:+x[0],open:+x[1],high:+x[2],low:+x[3],close:+x[4],volume:+x[5]})).filter(b=>b.close>0&&b.high>0);
    if(w.length<CFG.MIN_WEEKS)return null;
    const lc=w[w.length-1].close;
    if(cgPrice&&!(lc/cgPrice>=0.75&&lc/cgPrice<=1.33))return null;
    return w;
  }
  const e=new Error('RATE');e.rate=true;throw e;
}

/* ---------- indicators ---------- */
const sum=a=>a.reduce((x,y)=>x+y,0),mean=a=>sum(a)/a.length;
const amax=a=>Math.max.apply(null,a),amin=a=>Math.min.apply(null,a);
const argmax=a=>{let k=0;for(let i=1;i<a.length;i++)if(a[i]>a[k])k=i;return k;};
function smaAt(c,i,n){if(i<n-1)return NaN;let s=0;for(let k=i-n+1;k<=i;k++)s+=c[k];return s/n;}
function stdAt(c,i,n){if(i<n-1)return NaN;const m=smaAt(c,i,n);let s=0;for(let k=i-n+1;k<=i;k++)s+=(c[k]-m)*(c[k]-m);return Math.sqrt(s/(n-1));}
function rsiSeries(c,n){
  n=n||14;const a=1/n,N=c.length,rsi=new Array(N).fill(NaN);
  let up=NaN,dn=NaN;
  for(let i=1;i<N;i++){
    const d=c[i]-c[i-1],u=Math.max(d,0),w=Math.max(-d,0);
    if(i===1){up=u;dn=w;}else{up=(1-a)*up+a*u;dn=(1-a)*dn+a*w;}
    rsi[i]=100-100/(1+up/dn);
  }
  return rsi;
}
function pivotHighs(h,k){ // swing highs: higher than the k weeks before and at least as high as the k weeks after
  const out=[];
  for(let i=k;i<h.length-k;i++){
    let ok=true;
    for(let j=1;j<=k;j++){if(!(h[i]>h[i-j])||!(h[i]>=h[i+j])){ok=false;break;}}
    if(ok)out.push(h[i]);
  }
  return out;
}
function rsScore(c){ // IBD-style relative strength: 3, 6, 9, 12-month returns, the latest 3 months counted double
  const n=c.length;if(n<40)return null;
  const r=k=>c[n-1]/c[Math.max(0,n-1-k)]-1;
  return 2*r(13)+r(26)+r(39)+r(Math.min(52,n-1));
}
function pctRank(vals){ // pandas rank(pct=True) of the LAST element, average method
  const v=vals.filter(x=>isFinite(x));if(!v.length)return NaN;
  const last=v[v.length-1];let less=0,eq=0;
  for(const x of v){if(x<last)less++;else if(x===last)eq++;}
  return (less+(eq+1)/2)/v.length;
}

/* ---------- the rules (same as the Python scanner) ---------- */
function analyze(w){
  const n=w.length,c=w.map(b=>b.close),h=w.map(b=>b.high),l=w.map(b=>b.low),v=w.map(b=>b.volume);
  const last=c[n-1];
  let uv=0;for(let i=n-4;i<n;i++)uv+=v[i]*c[i];uv/=4;
  if(sum(v.slice(n-12))>0&&uv<CFG.MIN_VOL)return null; // skip the liquidity filter if the source has no volume
  const hi26=amax(h.slice(n-27,n-1)),dist=(hi26-last)/hi26*100,brokeOut=last>hi26;

  // fresh breakout: first close above its own prior-26w high within the lookback
  let bo=null;
  for(let k=CFG.LOOKBACK;k>=1;k--){
    const i=n-k,level=amax(h.slice(i-26,i)),prev=amax(h.slice(i-27,i-1));
    if(c[i]>level&&c[i-1]<=prev){bo={i:i,level:level,weeksAgo:k-1,volX:v[i]/mean(v.slice(i-12,i))};break;}
  }
  let earlyBo=false,ext=null,peak=null;
  if(bo){
    ext=(last-bo.level)/bo.level*100;
    peak=(amax(h.slice(bo.i))-bo.level)/bo.level*100;
    const holding=amin(c.slice(bo.i))>=bo.level*0.97;
    earlyBo=holding&&ext>=0&&ext<=CFG.MAX_EXT&&peak<=CFG.MAX_EXT+10;
  }
  let resIdx=n-27+argmax(h.slice(n-27,n-1)),boIdx=-1;
  if(earlyBo){boIdx=bo.i;resIdx=bo.i-26+argmax(h.slice(bo.i-26,bo.i));}

  const sma20=smaAt(c,n-1,20),sma5=smaAt(c,n-5,20),sma13=smaAt(c,n-13,20);
  const rsiS=rsiSeries(c),rsiNow=rsiS[n-1];
  const bw=[],atr=[];
  for(let i=Math.max(19,n-52);i<n;i++){bw.push(4*stdAt(c,i,20)/smaAt(c,i,20));}
  const tr=[];for(let i=0;i<n;i++){tr.push(i===0?h[i]-l[i]:Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1])));}
  for(let i=Math.max(13,n-52);i<n;i++){atr.push(mean(tr.slice(i-13,i+1))/c[i]);}
  const bwPct=pctRank(bw),atrPct=pctRank(atr);
  const range4=amax(h.slice(n-4))-amin(l.slice(n-4)),range12=amax(h.slice(n-12))-amin(l.slice(n-12));
  const volRatio=mean(v.slice(n-4))/mean(v.slice(n-12));
  const base=(amax(h.slice(n-6))-amin(l.slice(n-6)))/last*100;

  const R={
    'BB squeeze':bwPct<=0.25,
    'ATR compression':atrPct<=0.35,
    'Volume up in base':volRatio>1.1&&range4<range12*0.6,
    'Momentum':rsiNow>=50&&rsiNow<=70&&rsiNow>rsiS[n-5],
    'Above rising 20w MA':last>sma20&&sma20>sma5,
    'Tight base after run':sma20>sma13*1.05&&base<=20&&amin(l.slice(n-6))>sma20*0.97
  };
  const rules=Object.keys(R).filter(k=>R[k]);

  // ---- extras (they do not decide listing; they describe how clean the setup is) ----
  const tp=w.map(b=>(b.high+b.low+b.close)/3);
  const anchor=earlyBo?bo.i:resIdx;                 // VWAP starts at the breakout week, or at the 26-week high
  const vwSeries=new Array(n).fill(null);
  {let pv=0,vv=0;for(let i=anchor;i<n;i++){pv+=tp[i]*v[i];vv+=v[i];vwSeries[i]=vv>0?pv/vv:null;}}
  const vwapNow=vwSeries[n-1];
  let vwap26=null;{let pv=0,vv=0;for(let i=n-26;i<n;i++){pv+=tp[i]*v[i];vv+=v[i];}vwap26=vv>0?pv/vv:null;}
  const refPx=earlyBo?last:hi26;                    // resistance is looked for above this price
  const cands=pivotHighs(h,3).filter(x=>x>refPx*1.005);
  const histHigh=amax(h);if(histHigh>refPx*1.005)cands.push(histHigh);
  cands.sort((a,b)=>a-b);
  const groups=[];
  for(const x of cands){const g=groups[groups.length-1];if(g&&x<=g.top*1.03){g.top=x;g.sum+=x;g.cnt++;}else groups.push({top:x,sum:x,cnt:1});}
  const levels=groups.slice(0,3).map(g=>g.sum/g.cnt);
  const room=levels.length?(levels[0]-refPx)/refPx*100:null;
  const hasVol=sum(v.slice(n-12))>0;
  const refI=earlyBo?bo.i:n-1,rng=h[refI]-l[refI],cloc=rng>0?(c[refI]-l[refI])/rng:null;
  const quality=[
    vwapNow==null?null:last>=vwapNow,
    levels.length===0||room>=15,
    cloc==null?null:cloc>=(earlyBo?0.7:0.6),
    !hasVol?null:(earlyBo?bo.volX>=1.5:v[n-1]>=mean(v.slice(n-5,n-1)))
  ];
  // ---- trader rules (weekly versions of Weinstein, Minervini, O'Neil, Darvas, Turtle) ----
  const s10=smaAt(c,n-1,10),s30=smaAt(c,n-1,30),s30b=smaAt(c,n-5,30),s40=smaAt(c,n-1,40),s40b=smaAt(c,n-5,40);
  const win52=Math.min(52,n),hi52=amax(h.slice(n-win52)),lo52=amin(l.slice(n-win52));
  const bs=earlyBo?bo.i-10:n-10,be=earlyBo?bo.i:n;                       // the 10 weeks that formed the base
  const bHi=amax(h.slice(bs,be)),bLo=amin(l.slice(bs,be)),baseDepth=(bHi-bLo)/bHi*100;
  const atr14=mean(tr.slice(n-14)),gate=earlyBo?bo.level:hi26;
  const pro5=[
    last>s30&&s30>s30b,                                                      // Weinstein: Stage 2
    isNaN(s40b)?null:(last>s10&&s10>s30&&s30>s40&&s40>s40b),                 // Minervini: averages in order
    last>=1.3*lo52&&last>=0.75*hi52,                                         // Minervini: off the lows, near the highs
    earlyBo?ext<=5:dist<=5,                                                  // O'Neil: buy zone, do not chase
    baseDepth<=35                                                            // O'Neil / Darvas: orderly base
  ];
  return {pro5,baseDepth,boxFloor:bLo,atr14,atrPct:atr14/last*100,lossLvl:gate*0.925,stop2N:last-2*atr14,t55:last>amax(h.slice(n-12,n-1)),
    vwSeries,vwapNow,vwap26,levels,room,quality,cloc,brokeOut,earlyBo,dist,ext,peak,weeksAgo:bo?bo.weeksAgo:null,volX:bo?bo.volX:null,level:earlyBo?bo.level:hi26,
    resIdx,boIdx,price:last,rsi:rsiNow,base,nRules:rules.length,rules};
}

/* ---------- build one view (live / confirmed) ---------- */
const g6=x=>Number(Number(x).toPrecision(6)),r1=x=>Math.round(x*10)/10,r2=x=>Math.round(x*100)/100;
function toItem(r){
  const w=r.frame,n=w.length,off=Math.max(0,n-70),c=w.map(b=>b.close);
  const sma=[];for(let i=off;i<n;i++){const s=smaAt(c,i,20);sma.push(isNaN(s)?null:g6(s));}
  return {coin:r.coin,candles:w.slice(off).map(b=>[b.ts,g6(b.open),g6(b.high),g6(b.low),g6(b.close),g6(b.volume)]),sma:sma,
    level:g6(r.level),resIdx:r.resIdx-off,boIdx:r.boIdx>=0?r.boIdx-off:-1,price:g6(r.price),dist:r1(r.dist),
    ext:r.ext==null?null:r1(r.ext),weeksAgo:r.weeksAgo,volX:(r.volX==null||!isFinite(r.volX))?null:r2(r.volX),rsi:r1(r.rsi),base:r1(r.base),
    nRules:r.nRules,rules:r.rules,mcap:r2(r.mcap/1e9),news:[],newsOk:true,
    vwap:r.vwSeries.slice(off).map(x=>x==null?null:g6(x)),vwapNow:r.vwapNow==null?null:g6(r.vwapNow),vwap26:r.vwap26==null?null:g6(r.vwap26),
    levels:r.levels.map(g6),room:r.room==null?null:r1(r.room),q:r.quality,cloc:r.cloc==null?null:r2(r.cloc),
    pro:r.pro,rs:r.rs,rsBtc:r.rsBtc==null?null:r1(r.rsBtc),baseDepth:r1(r.baseDepth),boxFloor:g6(r.boxFloor),lossLvl:g6(r.lossLvl),stop2N:g6(r.stop2N),
    atrPct:r1(r.atrPct),t55:r.t55};
}
/* ---------- Bitcoin backdrop: the same trader rules applied to BTC's weekly chart ---------- */
function btcRegime(w){
  const n=w.length;if(n<34)return null;
  const c=w.map(b=>b.close),h=w.map(b=>b.high),l=w.map(b=>b.low),last=c[n-1],prev=c[n-2];
  const s10=smaAt(c,n-1,10),s20=smaAt(c,n-1,20),s20b=smaAt(c,n-5,20),s30=smaAt(c,n-1,30),s30b=smaAt(c,n-5,30),s40=smaAt(c,n-1,40),s40b=smaAt(c,n-5,40);
  const win=Math.min(52,n),hi52=amax(h.slice(n-win)),lo52=amin(l.slice(n-win));
  const hi26=amax(h.slice(n-27,n-1)),lo26=amin(l.slice(n-27,n-1));
  const rsi=rsiSeries(c)[n-1];
  const st=(bu,be)=>bu?'bull':be?'bear':'neutral';
  const dd=(hi52-last)/hi52*100,up=(last/lo52-1)*100;
  const rules=[
    {name:'Stage 2 or Stage 4',who:'Weinstein',state:st(last>s30&&s30>s30b,last<s30&&s30<s30b),
     text:'Close $'+fmt(last)+' is '+(last>s30?'above':'below')+' the 30-week average ($'+fmt(s30)+'), which is '+(s30>s30b?'rising':'falling or flat')+'.'},
    isNaN(s40b)?{name:'Averages in order',who:'Minervini',state:null,text:'Needs at least 44 weeks of history.'}:
    {name:'Averages in order',who:'Minervini',state:st(last>s10&&s10>s30&&s30>s40&&s40>s40b,last<s10&&s10<s30&&s30<s40&&s40<s40b),
     text:'10-week $'+fmt(s10)+', 30-week $'+fmt(s30)+', 40-week $'+fmt(s40)+'; the 40-week is '+(s40>s40b?'rising':'falling or flat')+'. Bullish needs price above 10 > 30 > 40, bearish the reverse.'},
    {name:'Short-term trend',who:'Scanner rule',state:st(last>s20&&s20>s20b,last<s20&&s20<s20b),
     text:'Close is '+(last>s20?'above':'below')+' the 20-week average ($'+fmt(s20)+'), which is '+(s20>s20b?'rising':'falling or flat')+'.'},
    {name:'Momentum (RSI)',who:'Scanner rule',state:st(rsi>=50,rsi<=45),
     text:'Weekly RSI is '+rsi.toFixed(0)+'. Bullish at 50 or more, bearish at 45 or less.'},
    {name:'Position in the 52-week range',who:'Minervini',state:st(last>=0.75*hi52&&last>=1.3*lo52,dd>=40),
     text:'Price is '+dd.toFixed(0)+'% below its 52-week high and '+up.toFixed(0)+'% above its 52-week low. Bullish: within 25% of the high and 30%+ off the low. Bearish: 40%+ below the high.'},
    {name:'26-week breakout state',who:'Scanner rule',state:st(last>=0.94*hi26,last<=1.06*lo26),
     text:last>=0.94*hi26?'Price is at or within 6% of the prior 26-week high ($'+fmt(hi26)+').':last<=1.06*lo26?'Price is at or within 6% of the prior 26-week low ($'+fmt(lo26)+').':'Price sits in the middle of its 26-week range ($'+fmt(lo26)+' to $'+fmt(hi26)+').'}
  ];
  const bull=rules.filter(r=>r.state==='bull').length,bear=rules.filter(r=>r.state==='bear').length;
  let verdict='Neutral';
  if(bull>=4&&bull-bear>=2)verdict='Bullish';else if(bear>=4&&bear-bull>=2)verdict='Bearish';
  const lean=verdict==='Neutral'?(bull>bear?'leaning bullish':bear>bull?'leaning bearish':'mixed'):'';
  const off=Math.max(0,n-110),ma=(k)=>{const o=[];for(let i=off;i<n;i++){const x=smaAt(c,i,k);o.push(isNaN(x)?null:g6(x));}return o;};
  return {verdict,lean,bull,bear,rules,price:g6(last),chg:r1((last/prev-1)*100),rsi:r1(rsi),dd:r1(dd),s30:g6(s30),s40:isNaN(s40)?null:g6(s40),
    item:{candles:w.slice(off).map(b=>[b.ts,g6(b.open),g6(b.high),g6(b.low),g6(b.close),g6(b.volume)]),sma:ma(30),
      mas:[{n:'10w',c:'#58a6ff',d:ma(10)},{n:'30w',c:'#f59e0b',d:ma(30)},{n:'40w',c:'#a78bfa',d:ma(40)}],
      level:g6(hi26),resIdx:n-27+argmax(h.slice(n-27,n-1))-off,boIdx:-1,price:g6(last),levels:[],vwap:[]}};
}

function buildView(full,meta,live,btcFull){
  const now=Date.now(),rows=[];
  const btcMap=new Map();if(btcFull)btcFull.forEach(b=>btcMap.set(b.ts,b.close));
  for(const sym of Object.keys(full)){
    let w=full[sym];
    if(!live&&w[w.length-1].ts+7*864e5>now)w=w.slice(0,-1);
    if(w.length<CFG.MIN_WEEKS)continue;
    const r=analyze(w);if(!r)continue;
    r.coin=sym;r.mcap=meta[sym];r.frame=w;rows.push(r);
  }
  // relative-strength rating (0-99): where each coin's weighted 3/6/9/12-month performance ranks among all scanned coins
  const scores=rows.map(r=>rsScore(r.frame.map(b=>b.close)));
  const valid=scores.filter(x=>x!=null);
  rows.forEach((r,i)=>{
    const sc=scores[i];
    if(sc==null||valid.length<2)r.rs=null;
    else{let less=0,eq=0;valid.forEach(x=>{if(x<sc)less++;else if(x===sc)eq++;});r.rs=Math.round(99*(less+(eq-1)/2)/(valid.length-1));}
    r.pro=r.pro5.concat([r.rs==null?null:r.rs>=70]);
    const w=r.frame,nn=w.length;
    const b1=btcMap.get(w[nn-1].ts),b0=btcMap.get(w[nn-27].ts);
    r.rsBtc=(b1&&b0)?((w[nn-1].close/w[nn-27].close-1)-(b1/b0-1))*100:null;
  });
  const early=rows.filter(r=>r.earlyBo&&r.rsi<75).sort((a,b)=>a.ext-b.ext);
  const about=rows.filter(r=>!r.brokeOut&&!r.earlyBo&&r.dist<=CFG.MAX_DIST&&r.nRules>=CFG.MIN_RULES).sort((a,b)=>(b.nRules-a.nRules)||(a.dist-b.dist));
  let bw=btcFull;if(bw&&!live&&bw[bw.length-1].ts+7*864e5>now)bw=bw.slice(0,-1);
  return {early:early.map(toItem),about:about.map(toItem),scanned:rows.length,btc:bw?btcRegime(bw):null};
}

const BULLISH=['surge','surging','rally','rallies','soar','soaring','jump','jumps','breakout','breaks out','all-time high','ath','record high','partnership','partners','listing','listed','lists','adoption','adopts','upgrade','mainnet','launch','launches','approval','approved','approves','etf','integration','integrates','bullish','inflow','inflows','gain','gains','climb','climbs','outperform','outperforms','institutional','buyback','burn','burns','milestone','expands','expansion','accumulate','accumulation','funding round','raises','backed by','tops','boost','boosts','highest'];
const BEARISH=['hack','hacked','exploit','exploited','drained','stolen','theft','lawsuit','sues','sued','sec charges','charges','ban','bans','banned','delist','delists','delisting','crash','crashes','plunge','plunges','dump','dumps','slump','slumps','drop','drops','falls','tumbles','bearish','outflow','outflows','liquidation','liquidations','selloff','sell-off','scam','fraud','rug pull','investigation','probe','vulnerability','outage','halts','halted','suspends','suspended','layoffs','bankruptcy','token unlock','unlock','warns','warning','fine','fined','lowest','decline','declines','loses','concern'];
const esc_re=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const mkRe=ws=>new RegExp('(?:^|[^\\w-])(?:'+ws.slice().sort((a,b)=>b.length-a.length).map(esc_re).join('|')+')(?![\\w-])','gi');
const BULL_RE=mkRe(BULLISH),BEAR_RE=mkRe(BEARISH);
const cnt=(re,t)=>{re.lastIndex=0;let k=0;while(re.exec(t))k++;return k;};
function headlineScore(title,body){
  const t=title||'',b=(body||'').slice(0,200);
  return cnt(BULL_RE,t)-cnt(BEAR_RE,t)+0.5*(cnt(BULL_RE,b)-cnt(BEAR_RE,b));
}
function normArt(a){
  let ts=+(a.PUBLISHED_ON||a.published_on||0);if(ts>1e12)ts=Math.floor(ts/1000);
  return {title:String(a.TITLE||a.title||'').trim(),url:String(a.URL||a.url||''),ts:ts,body:String(a.BODY||a.body||a.SUBTITLE||''),
    source:(a.SOURCE_DATA&&a.SOURCE_DATA.NAME)||(a.source_info&&a.source_info.name)||a.SOURCE||a.source||'',
    sentiment:String(a.SENTIMENT||'').toUpperCase(),
    cats:(Array.isArray(a.CATEGORY_DATA)?a.CATEGORY_DATA:[]).map(c=>String(c.CATEGORY||c.NAME||'').toUpperCase())};
}
const NEWS_CACHE={};let GENERAL=null;
async function fetchNews(sym){
  if(NEWS_CACHE[sym])return NEWS_CACHE[sym];
  if(!S.key)return NEWS_CACHE[sym]={out:[],ok:'nokey'};
  const tok=new RegExp('(?:^|[^\\w$])\\$?'+esc_re(sym)+'(?![\\w])'); // case-sensitive ticker in a headline
  let arts=[],ok=true;
  try{const j=await cdGet('/news/v1/article/list',{lang:'EN',limit:30,categories:sym});if(!j)ok=false;arts=listOf(j).map(normArt);}catch(e){ok=false;}
  const hasCats=arts.some(a=>a.cats.length);
  arts=arts.filter(a=>hasCats?(a.cats.indexOf(sym)>=0||tok.test(a.title)):tok.test(a.title));
  if(arts.length<3&&sym.length>=3){
    try{
      if(!GENERAL){const j=await cdGet('/news/v1/article/list',{lang:'EN',limit:100});GENERAL=listOf(j).map(normArt);}
      arts=arts.concat(GENERAL.filter(a=>a.cats.indexOf(sym)>=0||tok.test(a.title)));
    }catch(e){}
  }
  const cutoff=Date.now()/1000-CFG.NEWS_DAYS*86400,seen=new Set(),out=[];
  arts.sort((a,b)=>b.ts-a.ts);
  for(const a of arts){
    if(!a.title||seen.has(a.title)||!/^https?:/.test(a.url)||a.ts<cutoff)continue;
    seen.add(a.title);
    const sent=a.sentiment==='POSITIVE'?1:a.sentiment==='NEGATIVE'?-1:a.sentiment==='NEUTRAL'?0:(()=>{const sc=headlineScore(a.title,a.body);return sc>=1?1:sc<=-1?-1:0;})();
    out.push({title:a.title,url:a.url,ts:a.ts,source:a.source,sent:sent});
    if(out.length>=CFG.NEWS_MAX)break;
  }
  return NEWS_CACHE[sym]={out:out,ok:ok};
}

/* ---------- the full scan ---------- */
async function pool(items,n,fn){let i=0;await Promise.all(Array.from({length:n},async()=>{while(i<items.length&&!S.cancel){const k=i++;await fn(items[k],k);}}));}
async function runScan(progress){
  progress('Loading the top '+CFG.TOP_N+' coins…',0.02);
  const coins=await topCoins();
  progress('Checking data access…',0.04);
  if(S.src==='coindesk'){
    const t=listOf(await cdGet('/index/cc/v1/historical/days',{market:'cadli',instrument:'BTC-USD',limit:5,groups:'OHLC,VOLUME'}));
    if(!t.length){const e=new Error('CoinDesk did not return chart data for a test request.');e.nodata=true;throw e;}
  }else{
    const r=await fetch('https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=1w&limit=3').catch(e=>{throw netError('Could not reach the public market-data server ('+((e&&e.message)||e)+')');});
    if(r.status===451||r.status===403){DIAG.msg='Public market data is not available in your region (HTTP '+r.status+')';const e=new Error('REGION');e.region=true;throw e;}
    if(!r.ok){DIAG.msg='Public market data HTTP '+r.status;throw new Error('The public market-data server did not respond properly.');}
  }
  const full={},meta={};let done=0,limited=0,keyHit=false,netHit=null,regionHit=false;
  await pool(coins,CFG.CONC,async(c)=>{
    try{
      const w=S.src==='public'?await publicWeekly(c.sym,c.price):toWeekly(await coindeskDaily(c.sym)||[],c.price);
      if(w&&w.length>=CFG.MIN_WEEKS){full[c.sym]=w;meta[c.sym]=c.mcap;}
    }catch(e){if(e&&e.rate)limited++;if(e&&e.key)keyHit=true;if(e&&e.net)netHit=e;if(e&&e.region)regionHit=true;}
    done++;progress('Reading weekly charts… '+done+' / '+coins.length,0.05+0.8*done/coins.length);
    await sleep(60);
  });
  if(S.cancel)throw new Error('cancelled');
  if(!Object.keys(full).length){
    if(keyHit)throw keyError();
    if(regionHit){const e=new Error('The public data source is not available in your region.');e.region=true;throw e;}
    if(netHit)throw netHit;
    throw new Error(limited?'The data provider is rate-limiting this device. Wait a minute and try again.':'No chart data could be downloaded for any coin.');
  }
  progress('Reading the Bitcoin chart…',0.87);
  let btcFull=null;
  try{btcFull=S.src==='public'?await publicWeekly('BTC',null):toWeekly(await coindeskDaily('BTC')||[],null);}catch(e){btcFull=null;}
  if(btcFull&&btcFull.length<34)btcFull=null;
  progress('Finding setups…',0.88);
  const live=buildView(full,meta,true,btcFull),conf=buildView(full,meta,false,btcFull);
  const syms=Array.from(new Set([].concat(live.early,live.about,conf.early,conf.about).map(x=>x.coin)));
  let k=0;
  await pool(syms,2,async(s)=>{await fetchNews(s);k++;progress('Reading the news… '+k+' / '+syms.length,0.9+0.1*k/syms.length);await sleep(150);});
  for(const v of [live,conf])for(const it of v.early.concat(v.about)){const n=NEWS_CACHE[it.coin];if(n){it.news=n.out;it.newsOk=n.ok;}}
  return {generated:Date.now(),src:S.src,live:live,confirmed:conf,skipped:coins.length-Object.keys(full).length,limited:limited};
}

/* ---------- chart ---------- */
function view(){
  const n=cur.candles.length,N=Math.min(range,n),off=n-N,ri=cur.resIdx-off,bi=cur.boIdx>=0?cur.boIdx-off:-1;
  return {c:cur.candles.slice(off),sma:cur.sma.slice(off),mas:(cur.mas||[]).map(m=>({c:m.c,d:m.d.slice(off)})),vwap:(cur.vwap||[]).slice(off),n:N,ri:Math.max(0,ri),riVis:ri>=0,bi:bi>=0?bi:-1};
}
function updateOhlc(i){if(!cur)return;const V=view(),k=V.c[(i>=0&&i<V.n)?i:V.n-1];
  $('ohlc').innerHTML='<b>Week of '+fday(k[0])+'</b><br>O '+fmt(k[1])+' · H '+fmt(k[2])+' · L '+fmt(k[3])+' · C '+fmt(k[4]);}
function resize(){const b=cv.parentElement,r=b.getBoundingClientRect(),d=window.devicePixelRatio||1;if(!r.width)return;
  cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);cv.style.width=r.width+'px';cv.style.height=r.height+'px';
  ctx.setTransform(d,0,0,d,0,0);draw();}
function draw(){
  const W=cv.clientWidth,H=cv.clientHeight;ctx.clearRect(0,0,W,H);
  if(!cur||!W)return;
  const V=view(),c=V.c,n=V.n,narrow=W<520,padL=4,padR=narrow?56:70,padT=8,padB=22;
  const pw=W-padL-padR,ph=H-padT-padB,volH=ph*0.15,priceH=ph-volH-8;
  const cUp=css('--up'),cDn=css('--dn'),cMut=css('--muted'),cGrid=css('--grid'),cTxt=css('--text');
  let lo=Infinity,hi=-Infinity,vmax=0;
  c.forEach(k=>{lo=Math.min(lo,k[3]);hi=Math.max(hi,k[2]);vmax=Math.max(vmax,k[5]);});
  lo=Math.min(lo,cur.level);hi=Math.max(hi,cur.level);
  const hiC=hi;(cur.levels||[]).forEach(x=>{if(x<=hiC*1.15)hi=Math.max(hi,x);});
  const pad=(hi-lo)*0.08;lo-=pad;hi+=pad;
  const step=pw/n,bw=Math.max(1,step*0.62);
  const X=i=>padL+step*(i+0.5),Y=p=>padT+(hi-p)/(hi-lo)*priceH;
  LY={padL,step,n};
  ctx.font='11px -apple-system,system-ui,sans-serif';ctx.textBaseline='middle';
  for(let t=0;t<=4;t++){const p=lo+(hi-lo)*t/4,y=Y(p);
    ctx.strokeStyle=cGrid;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke();
    ctx.fillStyle=cMut;ctx.textAlign='left';ctx.fillText(fmt(p),W-padR+6,y);}
  ctx.textAlign='center';ctx.fillStyle=cMut;
  const every=Math.ceil(n/(narrow?4:7));for(let i=0;i<n;i+=every)ctx.fillText(fdate(c[i][0]),Math.max(padL+16,Math.min(X(i),W-padR-16)),H-padB/2);
  const y0=padT+ph;
  ctx.globalAlpha=.3;c.forEach((k,i)=>{ctx.fillStyle=k[4]>=k[1]?cUp:cDn;const vh=k[5]/vmax*volH;ctx.fillRect(X(i)-bw/2,y0-vh,bw,vh);});ctx.globalAlpha=1;
  c.forEach((k,i)=>{const up=k[4]>=k[1],col=up?cUp:cDn,x=X(i);
    ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,Y(k[2]));ctx.lineTo(x,Y(k[3]));ctx.stroke();
    const yt=Y(Math.max(k[1],k[4])),yb=Y(Math.min(k[1],k[4]));ctx.fillRect(x-bw/2,yt,bw,Math.max(1,yb-yt));});
  const lines=V.mas.length?V.mas.map(m=>({c:m.c,d:m.d})):[{c:css('--ma'),d:V.sma}];
  lines.forEach(L=>{ctx.strokeStyle=L.c;ctx.lineWidth=1.6;ctx.beginPath();let st=false;
    L.d.forEach((v,i)=>{if(v==null)return;const x=X(i),y=Y(v);if(!st){ctx.moveTo(x,y);st=true;}else ctx.lineTo(x,y);});ctx.stroke();});
  (cur.levels||[]).forEach((x,i)=>{if(x>hi)return;const yy=Y(x);
    ctx.globalAlpha=.9;ctx.strokeStyle=cMut;ctx.lineWidth=1;ctx.setLineDash([2,4]);ctx.beginPath();ctx.moveTo(padL,yy);ctx.lineTo(W-padR,yy);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
    ctx.font='11px -apple-system,system-ui,sans-serif';ctx.fillStyle=cMut;ctx.textAlign='left';ctx.fillText('R'+(i+1)+' $'+fmt(x),padL+4,yy-7);});
  if(V.vwap&&V.vwap.some(x=>x!=null)){ctx.strokeStyle=css('--vwap');ctx.lineWidth=1.8;ctx.setLineDash([]);ctx.beginPath();let sv=false;
    let lastVx=null,lastVy=null;
    V.vwap.forEach((x,i)=>{if(x==null)return;const px=X(i),py=Y(x);lastVx=px;lastVy=py;if(!sv){ctx.moveTo(px,py);sv=true;}else ctx.lineTo(px,py);});ctx.stroke();
    if(lastVx!=null){ctx.fillStyle=css('--vwap');ctx.beginPath();ctx.arc(lastVx,lastVy,3.5,0,7);ctx.fill();}}
  const early=!cur.isBtc&&tab==='early',lc=early?css('--green'):css('--amber'),ly=Y(cur.level),lx=X(V.ri);
  ctx.strokeStyle=lc;ctx.lineWidth=2;ctx.setLineDash(early?[]:[7,5]);
  ctx.beginPath();ctx.moveTo(V.riVis?lx:padL,ly);ctx.lineTo(W-padR,ly);ctx.stroke();ctx.setLineDash([]);
  if(V.riVis){ctx.beginPath();ctx.arc(lx,ly,3.5,0,7);ctx.fillStyle=lc;ctx.fill();}
  ctx.font='600 11px -apple-system,system-ui,sans-serif';ctx.textAlign='left';ctx.fillStyle=lc;
  const lt=(early?'Breakout level ':'Resistance ')+'$'+fmt(cur.level),tw=ctx.measureText(lt).width;
  ctx.fillText(lt,Math.max(padL+2,Math.min(lx+8,W-padR-tw-4)),ly-9);
  if(early&&V.bi>=0){
    const bx=X(V.bi);ctx.globalAlpha=.5;ctx.strokeStyle=lc;ctx.lineWidth=1;ctx.setLineDash([3,4]);
    ctx.beginPath();ctx.moveTo(bx,padT);ctx.lineTo(bx,padT+priceH);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
    const ay=Y(c[V.bi][3])+8;ctx.fillStyle=lc;ctx.beginPath();ctx.moveTo(bx,ay);ctx.lineTo(bx-6,ay+11);ctx.lineTo(bx+6,ay+11);ctx.closePath();ctx.fill();
    const bt=narrow?'BREAKOUT':'BREAKOUT CONFIRMED',bwid=ctx.measureText(bt).width;
    ctx.fillText(bt,Math.max(padL+2,Math.min(bx-bwid/2,W-padR-bwid-2)),ay+24);
  }
  const tag=(y,txt,bg)=>{ctx.fillStyle=bg;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(W-padR+1,y-9,padR-3,18,4);else ctx.rect(W-padR+1,y-9,padR-3,18);ctx.fill();ctx.fillStyle='#0b0f14';ctx.textAlign='left';ctx.font='700 11px -apple-system,system-ui,sans-serif';ctx.fillText(txt,W-padR+5,y);};
  let py=Y(c[n-1][4]);if(Math.abs(py-ly)<19)py=ly+(py>=ly?19:-19);
  tag(ly,fmt(cur.level),lc);tag(py,fmt(c[n-1][4]),c[n-1][4]>=c[n-1][1]?cUp:cDn);
  if(hover>=0&&hover<n){const x=X(hover);ctx.globalAlpha=.5;ctx.strokeStyle=cTxt;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,padT);ctx.lineTo(x,y0);ctx.stroke();ctx.globalAlpha=1;}
}
function pt(e){if(!LY||!cur)return;const r=cv.getBoundingClientRect();
  hover=Math.floor((e.clientX-r.left-LY.padL)/LY.step);if(hover<0||hover>=LY.n)hover=-1;updateOhlc(hover);draw();}
cv.addEventListener('pointerdown',pt);cv.addEventListener('pointermove',pt);
cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){hover=-1;updateOhlc(-1);draw();}});
window.addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(cv.parentElement);

function saveKey(andScan){S.key=$('keyin')?$('keyin').value.trim():S.key;store.set('bs_key',S.key);if(andScan===true){closeSheet();if(S.key)startScan(true);}else if($('keyin')){closeSheet();}}
function showKeySheet(msg,details){
  openSheet('<h2>One quick step</h2><p class="muted" style="font-size:14px;margin:0">'+esc(msg||'Chart data now comes from CoinDesk Data (the company that runs CryptoCompare), which needs an API key.')+'</p>'+
   '<small><b>1.</b> Open <a href="https://developers.coindesk.com/settings/api-keys" target="_blank" rel="noopener" style="color:var(--green);font-weight:650">developers.coindesk.com</a>, sign up or log in, then go to Settings, API keys, and add a new key.<br><b>2.</b> Copy the key and paste it below.<br>CoinDesk has been changing its free access. If it only offers paid plans, tap <b>Use public data</b> instead.</small>'+
   '<label for="keyin">Your CoinDesk API key</label><input id="keyin" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste your key here" value="'+esc(S.key)+'">'+
   (details?'<small>Technical detail: '+esc(details)+'</small>':'')+
   '<div class="row"><button class="btn primary" onclick="S.src=\'coindesk\';store.set(\'bs_src\',\'coindesk\');saveKey(true)">Save and scan</button></div>'+
   '<div class="row" style="margin-top:8px"><button class="btn" onclick="closeSheet()">Close</button><button class="btn" onclick="usePublic()">Use public data</button></div>');
}
function usePublic(){S.src='public';store.set('bs_src','public');closeSheet();startScan(true);}
function clearData(){store.del('bs_result_v1');RESULT=null;cur=null;sel=-1;history.replaceState(null,'',location.pathname+location.search);loadView();closeSheet();renderChrome();renderList();route();}
function cancelScan(){S.cancel=true;}
async function testConn(){
  const out=[];
  const show=(done)=>openSheet('<h2>'+(done?'Connection test':'Testing…')+'</h2><div style="font-size:13px;line-height:1.7;word-break:break-word">'+out.map(esc).join('<br>')+'</div>'+(done?'<div class="row"><button class="btn primary" onclick="showSettings()">Back</button><button class="btn" onclick="closeSheet()">Close</button></div>':''));
  const add=(ok,t)=>{out.push((ok?'✓ ':'✗ ')+t);show(false);};
  show(false);
  try{const j=await jget('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=3&page=1',1);add(true,'CoinGecko coin list: OK ('+j.length+' coins)');}catch(e){add(false,'CoinGecko coin list: '+((e&&e.message)||e));}
  if(S.key){
    DIAG.msg='';
    try{const d=listOf(await cdGet('/index/cc/v1/historical/days',{market:'cadli',instrument:'BTC-USD',limit:5,groups:'OHLC,VOLUME'},1));
      add(d.length>0,d.length?'CoinDesk candles: OK ('+d.length+' days, last close '+(+d[d.length-1].CLOSE).toPrecision(6)+')':'CoinDesk candles: '+(DIAG.msg||'no data returned'));}
    catch(e){add(false,'CoinDesk candles: '+(DIAG.msg||(e&&e.message)));}
    DIAG.msg='';
    try{const d=listOf(await cdGet('/news/v1/article/list',{lang:'EN',limit:3},1));
      add(d.length>0,d.length?'CoinDesk news: OK ('+d.length+' articles)':'CoinDesk news: '+(DIAG.msg||'no data returned'));}
    catch(e){add(false,'CoinDesk news: '+(DIAG.msg||(e&&e.message)));}
  }else add(false,'CoinDesk: no key saved yet');
  try{const r=await fetch('https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=1w&limit=3');
    add(r.ok,'Public market data: '+(r.ok?'OK':'HTTP '+r.status+(r.status===451?' (not available in your region)':'')));}
  catch(e){add(false,'Public market data: could not reach it ('+((e&&e.message)||e)+')');}
  show(true);
}
async function startScan(skipKeyCheck){
  if(S.scanning)return;
  if(S.src==='coindesk'&&!S.key&&skipKeyCheck!==true){showKeySheet();return;}
  DIAG.msg='';
  S.scanning=true;S.cancel=false;renderChrome();
  openSheet('<h2>Scanning the market</h2><div class="bar"><i id="pbar"></i></div><div id="ptext" class="muted" style="margin:0">Starting…</div>'+
    '<small>Keep this screen open for 1 to 3 minutes.</small><div class="row"><button class="btn" onclick="cancelScan()">Cancel</button></div>');
  let lock=null;try{if(navigator.wakeLock)lock=await navigator.wakeLock.request('screen');}catch(e){}
  const progress=(t,f)=>{const b=$('pbar'),p=$('ptext');if(b)b.style.width=Math.round(f*100)+'%';if(p)p.textContent=t;};
  try{
    const res=await runScan(progress);
    RESULT=res;const ok=store.set('bs_result_v1',res);
    loadView();tab=DATA.early.length||!DATA.about.length?'early':'about';cur=null;sel=-1;
    history.replaceState(null,'',location.pathname+location.search);
    S.scanning=false;closeSheet();renderChrome();renderList();route();
    if(!ok)alert('Scan finished, but this browser would not save the results. They will be lost when you close the page.');
  }catch(e){
    S.scanning=false;renderChrome();
    const det=e&&e.details||DIAG.msg;
    if(e&&e.key){showKeySheet(S.key?'CoinDesk did not accept the key. Check that you copied all of it, then try again.':'CoinDesk needs an API key to share chart data.',det);}
    else{
      const cancelled=e&&e.message==='cancelled';
      let msg=cancelled?'Scan cancelled.':(e&&e.message)||'Something went wrong.';
      if(e&&e.net)msg='Could not reach the data provider. Check your internet connection, and that no ad-blocker or VPN is blocking it.';
      if(e&&e.nodata)msg='CoinDesk accepted the request but returned no chart data. Your key may not include daily candles, or the service has changed.';
      const dt=(!cancelled&&det)?'<small>Technical detail: '+esc(det)+'</small>':'';
      const alt=(!cancelled&&S.src==='coindesk')?'<button class="btn" onclick="usePublic()">Use public data</button>':'<button class="btn" onclick="closeSheet()">Close</button>';
      openSheet('<h2>'+(cancelled?'Cancelled':'Scan failed')+'</h2><p class="muted" style="font-size:14px;margin:0">'+esc(msg)+'</p>'+dt+
        '<div class="row"><button class="btn primary" onclick="startScan()">Try again</button>'+alt+'</div>'+
        (!cancelled?'<div class="row" style="margin-top:8px"><button class="btn" onclick="testConn()">Test connection</button><button class="btn" onclick="closeSheet()">Close</button></div>':''));
    }
  }finally{try{if(lock)lock.release();}catch(e){}}
}

/* ---------- home-screen icon + manifest, generated in the page (so only ONE file is needed) ---------- */
function drawIcon(size){
  const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');
  x.fillStyle='#0b0e14';x.fillRect(0,0,size,size);
  const R=(a,b,w,h,col)=>{x.fillStyle=col;x.fillRect(a*size,b*size,w*size,h*size);};
  for(let px=0.14;px<0.86;px+=0.06)R(px,0.395,Math.min(0.04,0.86-px),0.015,'#f0b429');
  [[0.20,0.62,0.74],[0.32,0.56,0.70],[0.44,0.50,0.64],[0.56,0.42,0.58],[0.68,0.22,0.44]].forEach((b,i)=>{
    const col=i===4?'#3fb950':'#26a69a';R(b[0]+0.027,b[1]-0.06,0.016,b[2]-b[1]+0.12,col);R(b[0],b[1],0.07,b[2]-b[1],col);});
  return c.toDataURL('image/png');
}
function setupPwa(){
  try{
    const i180=drawIcon(180),i192=drawIcon(192),i512=drawIcon(512);
    const add=(rel,href,extra)=>{const l=document.createElement('link');l.rel=rel;l.href=href;if(extra)l.type=extra;document.head.appendChild(l);};
    add('apple-touch-icon',i180);add('icon',i192,'image/png');
    const m={name:'Breakout Scanner',short_name:'Breakouts',start_url:location.href.split('#')[0],display:'standalone',background_color:'#0b0e14',theme_color:'#0b0e14',
      icons:[{src:i192,sizes:'192x192',type:'image/png',purpose:'any maskable'},{src:i512,sizes:'512x512',type:'image/png',purpose:'any maskable'}]};
    add('manifest',URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'})));
  }catch(e){}
}

/* ---------- boot ---------- */
applyTheme(document.documentElement.getAttribute('data-theme')==='light'?'light':'dark');
loadView();
tab=DATA.early.length||!DATA.about.length?'early':'about';
renderChrome();renderList();route();setupPwa();
</script></body></html>
